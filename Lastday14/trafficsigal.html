<!DOCTYPE html>
<html>

<head>
    <title>Traffic Signal</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .signal {
            background-color: black;
            padding: 15px;
            border-radius: 10px;
        }

        .light {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgb(42, 41, 41);
            margin: 10px;
        }

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.rule {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}
    </style>
</head>

<body>
<div class="container">
    <div class="rule">
        Follow the traffic signal otherwise police will f**k you
    </div>

    <div class="signal">
        <div class="light" id="red"></div>
        <div class="light" id="yellow"></div>
        <div class="light" id="green"></div>
    </div>
</div>

    <script>
        let lights = ["red", "yellow", "green"];
        let index = 0;

        function changeSignal() {
            document.getElementById("red").style.backgroundColor = "rgb(42, 41, 41)";
            document.getElementById("yellow").style.backgroundColor = "rgb(42, 41, 41)";
            document.getElementById("green").style.backgroundColor = "rgb(42, 41, 41)";

            document.getElementById(lights[index]).style.backgroundColor = lights[index];

            index = (index + 1) % 3;
        }

        changeSignal();
        setInterval(changeSignal, 2000);

    </script>

</body>

</html>
