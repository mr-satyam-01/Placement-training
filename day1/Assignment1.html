<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    .link{
        color: black;
    }
    #a {
        display: flex;
        justify-content: center;
        align-items: center;

    }

    #b {
        display: flex;
        justify-content: start;
        align-items: start;
    }

    #c {
        display: flex;
        justify-content: end;
        align-items: end;
    }
</style>

<body>
    <div class="link">
   <a href="https://www.facebook.com/"> <i class="fa fa-facebook" id="a" ></i></a>
   <a href="https://www.instagram.com/"><i class="fa fa-instagram" id="b" ></i></a>
    <a href="https://www.whatsapp.com/"><i class="fa fa-whatsapp" id="c" ></i></a>
    </div>
</body>

</html>
