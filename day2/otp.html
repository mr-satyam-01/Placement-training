<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyOTP</title>
    <style>
        body {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Your six digit OTP is <span></span></h1>
    <button>Generate OTP</button>
    <Script>
        let myotp = document.querySelector('span')
        let btn = document.querySelector('button')

        btn.addEventListener('click', () => {
            let otp = "";
            for (let i = 0; i < 6; i++) {
                otp += Math.floor(Math.random() * 10)
                myotp.textContent = otp;
            }
        })
    </Script>
</body>

</html>
